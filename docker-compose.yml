services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: niet_qpg
      POSTGRES_USER: niet_qpg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niet_qpg -d niet_qpg"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://niet_qpg:${POSTGRES_PASSWORD:-change-this-database-password}@db:5432/niet_qpg
      SECRET_KEY: ${SECRET_KEY:-development-only-change-this-secret}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      UPLOAD_DIR: /app/uploads
      GENERATED_DIR: /app/generated_papers
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMe123!}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-Teacher123!}
    volumes:
      - private_uploads:/app/uploads
      - generated_files:/app/generated_papers
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  private_uploads:
  generated_files:
